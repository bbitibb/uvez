<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="56"
  height="56"
  viewBox="0 0 56 56"
  fill="none"
  color="#7AA2F7"
  role="img"
  aria-labelledby="uvez-logo-title uvez-logo-description"
>
  <title id="uvez-logo-title">Uvez logo</title>
  <desc id="uvez-logo-description">
    A continuous three-lobed knot representing separate things bound as one.
  </desc>

  <defs>
    <!-- Open the line at each crossing so the strand visibly weaves. -->
    <mask id="uvez-weave" x="0" y="0" width="56" height="56" maskUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="white" />
      <circle cx="28" cy="11.5" r="2.35" fill="black" />
      <circle cx="38.4" cy="29.5" r="2.35" fill="black" />
      <circle cx="17.6" cy="29.5" r="2.35" fill="black" />
    </mask>
  </defs>

  <!-- One unbroken trefoil: three parts held by a single binding line. -->
  <polyline
    points="28.00,31.50 33.19,31.02 38.07,29.63 42.38,27.42 45.86,24.57 48.32,21.29 49.66,17.84 49.80,14.49 48.78,11.50 46.70,9.12 43.73,7.57 40.07,7.00 36.00,7.50 31.79,9.09 27.73,11.71 24.08,15.25 21.07,19.50 18.89,24.23 17.66,29.16 17.42,33.99 18.14,38.43 19.75,42.20 22.07,45.08 24.90,46.89 28.00,47.50 31.10,46.89 33.93,45.08 36.25,42.20 37.86,38.43 38.58,33.99 38.34,29.16 37.11,24.23 34.93,19.50 31.92,15.25 28.27,11.71 24.21,9.09 20.00,7.50 15.93,7.00 12.27,7.57 9.30,9.12 7.22,11.50 6.20,14.49 6.34,17.84 7.68,21.29 10.14,24.57 13.62,27.42 17.93,29.63 22.81,31.02 28.00,31.50"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    mask="url(#uvez-weave)"
  />

  <!-- The three overpasses complete the knot without adding another shape. -->
  <g
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <polyline points="31.78,9.10 30.51,9.79 29.26,10.59 28.04,11.47 26.86,12.44 25.72,13.49 24.63,14.62" />
    <polyline points="38.59,33.97 38.62,32.52 38.55,31.05 38.40,29.55 38.15,28.04 37.81,26.53 37.38,25.03" />
    <polyline points="13.64,27.43 14.88,28.18 16.19,28.87 17.56,29.48 18.99,30.02 20.47,30.48 21.99,30.86" />
  </g>
</svg>
