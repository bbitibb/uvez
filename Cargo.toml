[package]
name = "uvez"
version = "0.1.0"
edition = "2024"
description = "A lightweight, tabbed container for Windows that groups standalone application windows into a single window with a native-feeling tab bar."
license = "MIT"
repository = "https://github.com/bbitibb/uvez"

[profile.release]
lto = "thin"
strip = true

[dependencies]
fontdue = "0.9"
softbuffer = "0.4"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30.13"
